# Netlify, Next.js'i otomatik algılar ve kendi Next.js çalışma zamanını
# (OpenNext tabanlı) kullanır; ek eklenti gerekmez. Güvenlik başlıkları
# `next.config.ts` → headers() üzerinden gelir.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
