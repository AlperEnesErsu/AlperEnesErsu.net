# Netlify, Next.js'i otomatik algılar ve kendi Next.js çalışma zamanını
# (OpenNext tabanlı) kullanır; ek eklenti gerekmez. Güvenlik başlıkları
# `next.config.ts` → headers() üzerinden gelir.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Oyunlar: sayfa ve service worker hiç bayat sunulmaz (oyuncunun hangi sürümü aldığını
# onlar belirler); assets/ altındaki dosyaların adında içerik özeti var, bir yıl kalır.
[[headers]]
  for = "/oyunlar/*/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/oyunlar/*/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/oyunlar/*/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Oyun dosyaları public/ altında durağan sunulur; Netlify'da next.config.ts'teki
# headers() bunlara ulaşmaz. Aynı politikalar burada: tek fark, oyunu bu sitenin
# kendisinin çerçeveye alabilmesi (Projeler'deki "Deneyimle").
[[headers]]
  for = "/oyunlar/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# Kısa adres: /fuse-and-fall → oyun.
[[redirects]]
  from = "/fuse-and-fall"
  to = "/oyunlar/fuse-and-fall/index.html"
  status = 302

# SiberOkul (public/siberokul/, SiberOkul deposundaki `npm run portfolio` ile gelir). Statik sayfalar
# CDN'den sunulur; oyunlarla aynı politika (sitenin kendisi "Deneyimle"de çerçeveleyebilir).
# Sayfalar her zaman taze, adında içerik özeti olan _astro/ dosyaları bir yıl önbellekte.
[[headers]]
  for = "/siberokul/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/siberokul/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Kısa adres: /siberokul (sonda / olmadan) → okul.
[[redirects]]
  from = "/siberokul"
  to = "/siberokul/"
  status = 301
